<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - شركة دبوس لطباعة وتصوير المستندات</title>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .logo-img {
            max-height: 75px;
            margin-bottom: 12px;
            object-fit: contain;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .phones {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
            direction: ltr;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .result-box {
            display: none;
            background: #ecfdf5;
            border: 1.5px solid #a7f3d0;
            border-radius: 14px;
            padding: 16px;
            margin-top: 18px;
            text-align: center;
        }

        .result-link {
            font-size: 0.95rem;
            font-weight: 700;
            color: #065f46;
            word-break: break-all;
            margin-bottom: 12px;
            display: block;
            direction: ltr;
        }

        .btn-copy {
            background: #047857;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .history-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .item-details {
            flex: 1;
            min-width: 0;
        }

        .item-amount {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .item-status {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            margin-right: 6px;
            font-weight: 700;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-used { background: #fee2e2; color: #991b1b; }

        .item-date {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-action-copy {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-action-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* إشعار منبثق مؤقت (Toast) */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0f172a;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ترويسة الشركة -->
        <div class="header-card">
            <img src="/logo.png" alt="شعار الشركة" class="logo-img" onerror="this.style.display='none'">
            <div class="title">شركة دبوس لطباعة وتصوير المستندات</div>
            <div class="subtitle">العقيلة - ق ٥ - مركز ضاري - الميزانين - محل رقم ٥</div>
            <div class="phones">56619683 - 66612278</div>
        </div>

        <!-- إنشاء رابط -->
        <div class="form-card">
            <div class="form-group">
                <label>رابط الدفع البنكي الأصلي:</label>
                <input type="text" id="originalUrl" placeholder="الصق الرابط البنكي هنا...">
            </div>
            <div class="form-group">
                <label>المبلغ المطلوب (د.ك):</label>
                <input type="number" id="amount" step="0.001" placeholder="مثال: 5.000">
            </div>
            <button class="btn-submit" id="btnSubmit" onclick="generateLink()">إنشاء رابط الفاتورة المخصص</button>

            <div class="result-box" id="resultBox">
                <span class="result-link" id="resultLink"></span>
                <button class="btn-copy" onclick="copyResultLink()">نسخ الرابط</button>
            </div>
        </div>

        <!-- السجل -->
        <div class="history-title">سجل العمليات الأخير:</div>
        <div id="historyList">جاري تحميل السجل...</div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        function showNotification(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
            }
            showNotification('تم نسخ الرابط الجديد');
        }

        function copyResultLink() {
            const link = document.getElementById('resultLink').innerText;
            copyText(link);
        }

        async function generateLink() {
            const urlInput = document.getElementById('originalUrl');
            const amountInput = document.getElementById('amount');
            const btn = document.getElementById('btnSubmit');

            const original_url = urlInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!original_url || isNaN(amount) || amount <= 0) {
                showNotification('يرجى التأكد من إدخال الرابط والمبلغ بشكل صحيح');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري الإنشاء...';

            try {
                const res = await fetch('/api/create-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ original_url, amount })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('resultBox').style.display = 'block';
                    document.getElementById('resultLink').innerText = data.payment_url;
                    
                    copyText(data.payment_url);

                    urlInput.value = '';
                    amountInput.value = '';
                    loadHistory();
                } else {
                    showNotification(data.error || 'فشل في إنشاء الرابط');
                }
            } catch (e) {
                showNotification('حدث خطأ في الاتصال بالخادم');
            } finally {
                btn.disabled = false;
                btn.innerText = 'إنشاء رابط الفاتورة المخصص';
            }
        }

        async function loadHistory() {
            const historyList = document.getElementById('historyList');
            try {
                const res = await fetch('/api/history');
                const data = await res.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    historyList.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">لا توجد عمليات سابقة حتى الآن</div>';
                    return;
                }

                const currentHost = window.location.origin;
                historyList.innerHTML = data.data.map(item => {
                    const fullUrl = `${currentHost}/pay/${item.id}`;
                    const isUsed = item.status === 'used';
                    const statusBadge = isUsed 
                        ? '<span class="item-status status-used">تم الدفع / مستخدم</span>' 
                        : '<span class="item-status status-pending">قيد الانتظار</span>';

                    return `
                        <div class="history-item">
                            <div class="item-details">
                                <div>
                                    <span class="item-amount">${Number(item.amount).toFixed(3)} د.ك</span>
                                    ${statusBadge}
                                </div>
                                <div class="item-date">${item.created_at || ''}</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn-action btn-action-copy" onclick="copyText('${fullUrl}')">نسخ</button>
                                <button class="btn-action btn-action-delete" onclick="deleteHistoryItem('${item.id}')">حذف</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                // هدوء في حالة فشل مؤقت
            }
        }

        async function deleteHistoryItem(id) {
            try {
                const res = await fetch(`/api/delete/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showNotification('تم حذف العملية من السجل');
                    loadHistory();
                } else {
                    showNotification('تعذر حذف العملية');
                }
            } catch (e) {
                showNotification('خطأ أثناء الحذف');
            }
        }

        // تشغيل الجلب أول مرة وتكراره كل 3 ثوانٍ تلقائياً
        window.onload = () => {
            loadHistory();
            setInterval(loadHistory, 3000);
        };
    </script>
</body>
</html>
